<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHỨNG KHOÁN K - Pro K1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            DEFAULT: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #121826; border: 1px solid #1e293b; border-radius: 0.75rem; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-[#121826] border-b border-[#1e293b] py-3 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 text-white font-bold px-3 py-1.5 rounded-lg text-lg tracking-wider">K</div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
                        CHỨNG KHOÁN K <span class="bg-red-500/20 text-red-400 text-xs px-2 py-0.5 rounded border border-red-500/30">PRO K1</span>
                    </h1>
                    <p class="text-xs text-slate-400">Rà Soát Nhanh Thị Trường & Realtime Data (TCBS / FireAnt)</p>
                </div>
            </div>
            
            <!-- VN-Index Header Bar -->
            <div class="flex items-center gap-4 text-xs">
                <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                    <span class="text-slate-400 block text-[10px]">VN-INDEX</span>
                    <span id="val-vnindex" class="text-emerald-400 font-bold text-sm">1,286.50 ↑ (+8.20 / +0.64%)</span>
                </div>
                <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                    <span class="text-slate-400 block text-[10px]">TỔNG GTGD (3 SÀN)</span>
                    <span id="val-totalval" class="font-bold text-sm text-slate-200">13,807.3 Tỷ</span>
                </div>
                <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                    <span class="text-slate-400 block text-[10px]">KHỐI NGOẠI</span>
                    <span id="val-foreign" class="text-red-400 font-bold text-sm">-240 Tỷ (Bán ròng)</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

        <!-- Quick Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="card p-4">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-chart-pie text-blue-400 mr-1.5"></i> Độ Rộng Thị Trường</h2>
                <div class="flex justify-between text-xs font-bold mb-1">
                    <span id="mb-up" class="text-emerald-400">156 CP Tăng</span>
                    <span id="mb-ref" class="text-yellow-400">75 Tham chiếu</span>
                    <span id="mb-down" class="text-red-400">106 CP Giảm</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex">
                    <div class="bg-emerald-500 h-full" style="width: 50%"></div>
                    <div class="bg-yellow-500 h-full" style="width: 20%"></div>
                    <div class="bg-red-500 h-full" style="width: 30%"></div>
                </div>
            </div>

            <div class="card p-4">
                <h2 class="text-
