<!-- JavaScript Logic -->
    <script>
        function switchTab(tabId) {
            const tabs = ['tiem-nang', 'danh-muc', 'dong-tien', 'thong-tin', 'youtube', 'ai-copilot'];
            tabs.forEach(t => {
                const elTab = document.getElementById('tab-' + t);
                const elBtn = document.getElementById('btn-' + t);
                if (elTab) elTab.classList.add('hidden');
                if (elBtn) {
                    elBtn.classList.remove('bg-red-600', 'text-white');
                    elBtn.classList.add('bg-slate-800', 'text-slate-300');
                }
            });
            const activeTab = document.getElementById('tab-' + tabId);
            const activeBtn = document.getElementById('btn-' + tabId);
            if (activeTab) activeTab.classList.remove('hidden');
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
                activeBtn.classList.add('bg-red-600', 'text-white');
            }
        }

        function loadSymbol(symbol) {
            document.getElementById('tradingview_chart_container').innerHTML = '';
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "Asia/Ho_Chi_Minh",
                "theme": "dark",
                "style": "1",
                "locale": "vi_VN",
                "toolbar_bg": "#131b2e",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart_container"
            });
        }

        window.onload = function () {
            loadSymbol('HOSE:VNINDEX');
        };

        // Tự động nạp dữ liệu realtime từ file data.json cho phiên giao dịch
        fetch('data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                console.log("Đã nạp dữ liệu data.json thành công:", data);
                
                // 1. Cập nhật VN-Index trên Header
                if (data && data.vn_index) {
                    const indexEl = document.querySelector('header .text-emerald-400, header .text-red-400');
                    if (indexEl) {
                        const sign = data.vn_index.change >= 0 ? '↑' : '↓';
                        const colorClass = data.vn_index.change >= 0 ? 'text-emerald-400' : 'text-red-400';
                        indexEl.className = `${colorClass} font-bold text-sm`;
                        indexEl.innerText = `${data.vn_index.value.toLocaleString()} ${sign} (+${data.vn_index.change} / +${data.vn_index.percent}%)`;
                    }
                }

                // 2. Cập nhật Khối ngoại
                if (data && data.foreign_flow) {
                    const foreignEls = document.querySelectorAll('header div');
                    foreignEls.forEach(el => {
                        if (el.innerHTML.includes('KHỐI NGOẠI')) {
                            const valSpan = el.querySelector('span:last-child');
                            if (valSpan) valSpan.innerText = data.foreign_flow;
                        }
                    });
                }

                // 3. Cập nhật Độ rộng thị trường (Tăng / Tham chiếu / Giảm)
                if (data && data.market_breadth) {
                    const breadthContainer = document.querySelector('.fa-chart-pie').closest('.card');
                    if (breadthContainer) {
                        const spans = breadthContainer.querySelectorAll('.flex.justify-between.text-xs.font-bold.mb-1 span');
                        if (spans.length >= 3) {
                            spans[0].innerText = `${data.market_breadth.up} CP Tăng`;
                            spans[1].innerText = `${data.market_breadth.reference} Tham chiếu`;
                            spans[2].innerText = `${data.market_breadth.down} CP Giảm`;
                        }
                    }
                }

                // 4. Cập nhật Tâm lý thị trường
                if (data && data.sentiment) {
                    const sentimentEl = document.querySelector('.fa-face-smile');
                    if (sentimentEl) {
                        const parentCard = sentimentEl.closest('.card');
                        const targetBadge = parentCard.querySelector('.font-bold');
                        if (targetBadge) targetBadge.innerText = data.sentiment;
                    }
                }
            })
            .catch(err => console.log("Lỗi nạp data.json:", err));
    </script>
